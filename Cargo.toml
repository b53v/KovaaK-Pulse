[package]
name = "kovaak-pulse"
version = "0.1.0"
edition = "2024"
description = "Lightweight native Rust + iced 0.14 real-time monitor and long-term analytics GUI for KovaaK's"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "canvas", "tokio", "crisp", "advanced-shaping"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
winreg = "0.52"
tray-icon = "0.19"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
